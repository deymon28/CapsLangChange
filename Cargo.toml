[package]
name = "capslangchange"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Caps Lock layout switching and per-program keyboard shortcut bindings for Windows, with a tray icon"
license = "MIT"
repository = "https://github.com/deymon28/CapsLangChange"
readme = "README.md"
build = "build.rs"
publish = false

[[bin]]
name = "CapsLangChange"
path = "src/main.rs"

[dependencies]
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Globalization", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_System_Power"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
